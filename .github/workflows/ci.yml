name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Unit + integration tests
        run: pnpm test

  lighthouse-optional:
    if: ${{ vars.RUN_LIGHTHOUSE == 'true' }}
    runs-on: ubuntu-latest
    needs: quality
    continue-on-error: true

    steps:
      - name: Placeholder
        run: echo "Enable Lighthouse CI in this job when preview URL and budgets are finalized."
