<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Production weather forecast app with hourly and daily outlook." />
    <meta name="theme-color" content="#0d2a3f" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./assets/icons/icon-192.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./assets/icons/icon-192.svg" />
    <link rel="stylesheet" href="./style/style.css" />
    <link rel="stylesheet" href="./style/lightmode.css" id="theme" />
    <script src="./scripts/skycons.js" defer></script>
    <script src="./scripts/switcher.js" defer></script>
    <script type="module" src="./scripts/app.mjs"></script>
    <title>Weather Forecast Pro</title>
  </head>
  <body>
    <a class="skip-link" href="#app">Skip to content</a>

    <header class="topbar">
      <div>
        <h1>Plan Your Day With Confidence</h1>
      </div>
      <div class="topbar-controls">
        <button id="unit-switcher" class="btn-utility" type="button" aria-label="Toggle temperature units">°C</button>
        <button id="theme-switcher" class="btn-utility" type="button" aria-label="Toggle theme">Light</button>
      </div>
    </header>

    <main id="app" aria-live="polite" aria-busy="true">
      <section id="status-banner" class="status-banner" role="status">Loading weather data...</section>

      <section class="panel location-panel" aria-label="Location controls">
        <form id="city-form" class="city-form">
          <input
            id="city-input"
            type="search"
            placeholder="Search city (e.g. Tbilisi)"
            aria-label="Search city"
            aria-controls="city-results"
            aria-autocomplete="list"
          />
          <button type="submit" class="btn-primary">Search</button>
        </form>
        <div class="location-actions">
          <button id="use-location" type="button" class="btn-primary">Use my location</button>
          <button id="retry-button" type="button" class="btn-primary">Retry</button>
          <div id="city-results" class="city-results" aria-label="Search results" role="listbox"></div>
        </div>
      </section>

      <section class="hero panel loading" id="hero-panel" aria-label="Current weather overview">
        <div>
          <p class="hero-location" id="hero-location">Loading location...</p>
          <h2 class="hero-temp" id="hero-temp">--</h2>
          <p class="hero-condition" id="hero-condition">--</p>
          <p class="hero-updated" id="hero-updated">--</p>
        </div>
        <canvas id="hero-icon" class="hero-icon" width="280" height="280"></canvas>
      </section>

      <section class="panel loading" aria-label="Hourly forecast">
        <h3>Next 24 Hours</h3>
        <ul id="hourly-list" class="hourly-list"></ul>
      </section>

      <section class="panel loading" aria-label="Five-day forecast">
        <h3>5-Day Forecast</h3>
        <ul id="daily-list" class="daily-list"></ul>
      </section>

      <section class="panel loading" aria-label="Weather metrics">
        <h3>Air & Atmosphere</h3>
        <div class="metrics-grid" id="metrics-grid"></div>
      </section>
    </main>
  </body>
</html>
